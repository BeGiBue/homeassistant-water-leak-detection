name: Publish 1.0.0

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Verify release metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(
              Path("custom_components/water_leak_detection/manifest.json").read_text()
          )
          assert manifest["version"] == "1.0.0", manifest["version"]
          assert manifest["integration_type"] == "service", manifest["integration_type"]
          assert manifest["name"] == "Water Leak Guard", manifest["name"]
          assert Path("RELEASE_NOTES_1.0.0.md").is_file()
          print("Release metadata verified for 1.0.0 (normal service integration)")
          PY

      - name: Publish GitHub Release 1.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "1.0.0" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release 1.0.0 already exists."
            exit 0
          fi

          gh release create "1.0.0"             --repo "${GITHUB_REPOSITORY}"             --target "main"             --title "Water Leak Guard 1.0.0"             --notes-file "RELEASE_NOTES_1.0.0.md"
