name: Validate

on:
  push:
    branches:
      - main
      - impl-v0.1.0
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "homeassistant>=2026.6.0,<2027.0.0" pytest pytest-asyncio ruff
      - name: Validate JSON
        run: |
          python -m json.tool custom_components/water_leak_detection/manifest.json >/dev/null
          python -m json.tool custom_components/water_leak_detection/strings.json >/dev/null
          python -m json.tool custom_components/water_leak_detection/translations/de.json >/dev/null
          python -m json.tool hacs.json >/dev/null
      - name: Compile
        run: python -m compileall -q custom_components tests
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
