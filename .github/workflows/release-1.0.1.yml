name: Publish 1.0.1

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-tag-1.0.1
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read
  release:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Verify release metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(
              Path("custom_components/water_leak_detection/manifest.json").read_text()
          )
          assert manifest["version"] == "1.0.1", manifest["version"]
          assert manifest["integration_type"] == "service", manifest["integration_type"]
          assert manifest["name"] == "Water Leak Guard", manifest["name"]
          assert Path("RELEASE_NOTES_1.0.1.md").is_file()
          print("Release metadata verified for 1.0.1")
          PY

      - name: Publish GitHub Release 1.0.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Common logic checks tag SHA even when no Release exists yet.
          bash .github/release_checked_commit.sh 1.0.1 --target "${GITHUB_SHA}"
