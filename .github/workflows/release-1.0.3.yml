name: Publish 1.0.3

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-1.0.3.yml"

permissions:
  contents: write

concurrency:
  group: release-tag-1.0.3
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Release 1.0.3'
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read

  release:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Release 1.0.3'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Verify release metadata
        run: |
          python - <<'PY'
          import json
          import tomllib
          from pathlib import Path

          manifest = json.loads(
              Path("custom_components/water_leak_detection/manifest.json").read_text()
          )
          assert manifest["version"] == "1.0.3", manifest["version"]
          assert manifest["integration_type"] == "service", manifest["integration_type"]
          assert manifest["name"] == "Water Leak Guard", manifest["name"]
          assert Path("RELEASE_NOTES_1.0.3.md").is_file()
          assert Path("LICENSE").is_file()

          pyproject = tomllib.loads(Path("pyproject.toml").read_text())
          assert pyproject["project"]["version"] == "1.0.3"
          assert pyproject["project"]["license"] == "AGPL-3.0-only"

          changelog = Path("CHANGELOG.md").read_text()
          assert "## 1.0.3 — 2026-10-10" in changelog

          print("Release metadata verified for 1.0.3 / AGPL-3.0-only")
          PY

      - name: Publish GitHub Release 1.0.3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/release_checked_commit.sh 1.0.3 --target "${GITHUB_SHA}"
