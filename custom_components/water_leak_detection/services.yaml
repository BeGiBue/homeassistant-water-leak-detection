start_high_flow_bypass:
  name: Start high-flow bypass
  description: Temporarily suppress only High Flow detection. Burst Leak stays active.
  fields:
    config_entry_id:
      name: Config entry ID
      description: Optional when only one Water Leak Guard instance is configured.
      required: false
      selector:
        text:
    duration_minutes:
      name: Duration
      description: Bypass duration. If omitted, the configured default is used.
      required: false
      selector:
        number:
          min: 1
          max: 1440
          step: 1
          unit_of_measurement: min

cancel_high_flow_bypass:
  name: Cancel high-flow bypass
  description: Re-enable High Flow detection immediately.
  fields:
    config_entry_id:
      name: Config entry ID
      description: Optional when only one Water Leak Guard instance is configured.
      required: false
      selector:
        text:

reset_learning:
  name: Reset adaptive learning
  description: Clears all admitted normal-flow learning samples. Detector settings and active leak events are not reset.
  fields:
    config_entry_id:
      name: Config entry ID
      description: Optional when only one Water Leak Guard instance is configured.
      required: false
      selector:
        text:
