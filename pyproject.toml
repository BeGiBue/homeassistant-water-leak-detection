[project]
name = "homeassistant-water-leak-detection"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
test = [
  "homeassistant>=2026.6.0",
  "pytest>=8.0",
  "pytest-asyncio>=0.24"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
